name = "coach"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secret (set once with `npx wrangler secret put NOTION_TOKEN`, never commit it):
#   NOTION_TOKEN    - Notion internal integration secret
# Optional: to add a password later, set APP_PASSWORD and SESSION_SECRET the same way.

[vars]
# No password: the app opens straight away for anyone with the URL.
# If an APP_PASSWORD secret is ever set, sign-in turns back on automatically.
NO_PASSWORD = "yes"
