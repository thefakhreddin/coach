name = "coach"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secrets (set once with `npx wrangler secret put NAME`, never commit them):
#   NOTION_TOKEN    - Notion internal integration secret
#   APP_PASSWORD    - the password you and Rozhin type to open the app
#   SESSION_SECRET  - any long random string

[vars]
# Change to "yes" to open the app without a password. Anyone with the URL could then
# read your logs and add or delete rows in your Notion. Leave as "no" to require APP_PASSWORD.
NO_PASSWORD = "no"
